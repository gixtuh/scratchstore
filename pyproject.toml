[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scratchstore"
version = "1.3.0"
authors = [
    { name="gixtuh" }
]
description = "ScratchStore is a cloud data store/database engine which lets you write anything into a data store file using Python and Scratch with the power of cloud variables."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.31.0",
    "websocket-client>=1.8.0"
]


[project.urls]
Homepage = "https://github.com/gixtuh/scratchstore"